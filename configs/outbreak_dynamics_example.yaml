# Example configuration for the inframind-proteus outbreak dynamics simulator.
#
# All fields can be overridden via CLI:
#   --set section.key=value     (generic dot-notation override)
#   --<named-param> value       (shortcut for important parameters)
# ----------------------------------------------------------------------------

simulation:
  mode: calibration            # "calibration" | "projection"
  num_simulations: 1000
  num_time_steps: 62           # steps after the warm-up window
  gt_max: 49                   # maximum generation time (days)
  rng_seed: 123

# ----------------------------------------------------------------------------
temporal:
  # Timestamps accept: ISO date ("YYYY-MM-DD"), float days, or YYYYWW integer.
  zero_date: "2023-10-01"
  sim_start: "2023-07-16"
  calibration_start: "2023-10-01"    # calibration mode only
  calibration_end:   "2024-04-01"    # calibration mode only
  step_dt: 7                         # days per step (7 = weekly)

# ----------------------------------------------------------------------------
location:
  # location_id_variable: one of geocode | uf | uf_code |
  #                        regional_geocode | macrorregional_geocode
  location_id_variable: "uf"
  location_id: "DF"
  population_size: 3094325  # Population for DF

# ----------------------------------------------------------------------------
generation_time:
  model: constant_gamma
  params:
    shape: 10.0
    scale: 1.8          # mean = shape × scale ≈ 18 days

# ----------------------------------------------------------------------------
reproduction_number:
  model: logistic
  # Fixed (non-sampled) defaults — overridden by sampling.lhs_params below
  # for dimensions that are sampled.
  params:
    rt_logist_roff:   1.0        # R outside the active window (off-season)
    rt_logist_start:  50.0       # day the logistic window opens
    rt_logist_end:    280.0      # day the logistic window closes (returns to roff)
    rt_logist_center: 50.0      # Duration from start to inflection point (days)
    rt_logist_width:  20.0       # steepness (days); larger = smoother
    rt_logist_rmin:   0.2        # asymptotic minimum R during outbreak
    rt_logist_rmax:   1.6        # peak R ("R0"-like)

# ----------------------------------------------------------------------------
sampling:
  # Parameters to explore during calibration.
  method: sobol  # lhs, sobol
  rng_seed: 123

  # Ranges are [lower_bound, upper_bound].
  # Listed parameters override the fixed values above.
  param_ranges:
#    rt_logist_start:          [0,    150  ]
#    rt_logist_width:          [1,    150  ]
    rt_logist_center:         [0,   100 ]
    rt_logist_rmax:           [1.05,  4.0 ]
    notif_nb_overdispersion:  [0.1,  100 ]
#    notif_scaling_factor:     [10,   3000]

  # Scale specification: "linear" (default) or "log"
  # Unspecified parameters default to linear scale.
  param_scales:
    notif_scaling_factor: log

# ----------------------------------------------------------------------------
initial_infections:
  # Warm-up seeding method.
  method: ones
  # Method parameters (currently unused for "ones").
  params: {}

# ----------------------------------------------------------------------------
observation_model:
  params:
    notif_nb_overdispersion: 10.0
    notif_scaling_factor:     250.
    #    notif_relative_scale:   1.0    # scaling = relative_scaling * population / 100k

# ----------------------------------------------------------------------------
scoring:
  case_beam_quantiles: [0.025, 0.25, 0.5, 0.75, 0.975]

# ----------------------------------------------------------------------------
output:
  main_dir: "outputs/outbreak_dynamics_example"
  save_infec_trajectories: false
  save_cases_trajectories: true
  save_case_beam: true
  save_scores: true          # written only in calibration mode
